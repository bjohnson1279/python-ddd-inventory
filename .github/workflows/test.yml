name: Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Run Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Merge Conflict Markers
        run: |
          echo "Scanning codebase for git merge conflict markers..."
          if git grep -n -I -E '^(<{7}|={7}|>{7}|\|{7})([[:space:]]|$)'; then
            echo "::error::Merge conflict markers detected in tracked files! Please resolve conflicts before merging."
            exit 1
          fi
          echo "No conflict markers detected."

      - name: Check for Python Standard Library Shadowing
        run: |
          echo "Scanning for stray files that shadow Python standard library modules..."
          SHADOW_FILES=("inspect.py" "json.py" "logging.py" "sys.py" "os.py" "test.py" "unittest.py" "datetime.py")
          for file in "${SHADOW_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "::error::Found stray '$file' in the root directory! This shadows the Python standard library."
              exit 1
            fi
          done
          echo "No shadowing files detected."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest

  costing-postgres:
    name: PostgreSQL costing and migration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: costing-test-only
          POSTGRES_DB: costing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d costing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify migration, costing and concurrent writes
        env:
          COSTING_TEST_DATABASE_URL: postgresql+asyncpg://postgres:costing-test-only@127.0.0.1:5432/costing_test
        run: pytest tests/infrastructure/test_costing_postgres.py -q --tb=short
